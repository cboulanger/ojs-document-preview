# Checks that need no OJS: PHP syntax, locale keys, JavaScript syntax and the release package.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax
        run: |
          if ! git ls-files -z '*.php' | xargs -0 -n1 php -l > lint.txt 2>&1; then
            grep -v '^No syntax errors' lint.txt
            exit 1
          fi

      - name: Locale files
        run: |
          # Same keys in English and German, and every key used is defined
          diff <(grep '^msgid' locale/en/locale.po) <(grep '^msgid' locale/de/locale.po)
          diff <(git grep -hoE 'plugins\.generic\.documentPreview\.[A-Za-z.]+' -- ':!locale' | sort -u) \
               <(grep -oE 'plugins\.generic\.documentPreview\.[A-Za-z.]+' locale/en/locale.po | sort -u)

      - name: JavaScript syntax
        run: for f in js/documentPreview.js js/renderers/*.js; do node --check "$f"; done

      - name: Release package
        run: dev/package.sh --out dist
